hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

# Trajectory-level async RL (Laminar-style):
#   producer  = TrajectoryLevelRollouter — one queue message per response
#               (uid/traj_index/group_size/model_version stamped; FAILED rows
#               on generation failure)
#   consumer  = TrajectoryAsyncTrainer — re-assembles GRPO groups from
#               per-trajectory rows; trains on complete, fresh groups only
#   weights   = optional multi-version pull path (async_training.weight_store):
#               the trainer publishes stage-only versions; the rollout side
#               pulls at its batch boundaries. Requires the kimi engine.

async_training:

  # Maximum samples staleness threshold
  staleness_threshold: 0.1

  # Frequency of parameter synchronization between rollouter and trainer,
  # One step means trainer obtains a batch of required samples
  trigger_parameter_sync_step: 4

  # The number of ppo_mini_batches that the trainer obtains once
  require_batches: 1

  # When synchronizing parameters, whether to resume generation when rollout is interrupted.
  # If True, LLMServerClient auto resume generation, making rollout interruption invisible to the AgentLoop.
  partial_rollout: True

  # whether to use trainer do_validate
  use_trainer_do_validate: False

  # Whether to enable dynamic resource scheduling.
  use_dynamic_resource_scheduling: False

  # Name of the dynamic scheduling policy ("default" or custom registered name).
  dynamic_schedule_policy: "default"

  # Sample-collection ratio threshold for deactivating hybrid replicas.
  dynamic_schedule_deactivate_ratio: 0.3

  # Whether to rebalance (abort + clear sticky cache + resume) in-flight requests
  # across newly activated hybrid replicas via least-loaded routing.
  dynamic_schedule_enable_rebalance: True

  # Maximum number of concurrent generation requests per replica.
  concurrent_samples_per_replica: 16

  # ---- trajectory-level async (this package) ----

  # Trainer-side GRPO group re-assembly from per-trajectory messages.
  # False = stock group-level consumption (whole-group messages).
  trajectory_group_assembly: True

  # Per-trajectory staleness refusal: a trajectory generated more than this
  # many trainer versions behind the current one is dropped (its group goes
  # incomplete and is eventually evicted). null = no refusal (paper: emergent
  # staleness, no static cap — rely on staleness_threshold instead).
  staleness_drop: null

  # Partial response pool (§3.1 substrate): central version-gated store
  # of in-progress trajectories. The producer's row retries consult it —
  # a same-version partial turns a retry into a resume instead of a
  # restart. Token-level WRITERS (the LLM client seam / resume-aware
  # agent loops) are the documented external seam — see README TODO-16.
  partial_pool:
    enabled: false
    max_entries: 4096
    # max_bytes: null
    # ttl_s: null          # e.g. 3600: partials of retired versions age out

  # Fault tolerance (§3.3 heartbeat + §4.3 master failover): heartbeat the
  # relay controller (recreate + recover + re-attach consumers on death);
  # probe replica liveness (retire dead servers from routing — retries
  # then redirect to healthy replicas; revive restarted ones).
  fault_tolerance:
    enabled: true
    heartbeat_s: 10.0
    failure_threshold: 3   # consecutive probe failures before retire

  # Long-tail mitigation (one straggler must not poison its group):
  # row_max_attempts: bounded per-row generation retries (producer-side;
  #   2 = one retry; 1 = single-shot). Retried rows re-stamp the version
  #   they actually generated under (mixed-version group -> version_span
  #   + staleness_correction handle it).
  # min_group_survivors: deliver the SURVIVORS of a group whose member
  #   terminally failed as a trainable PARTIAL group (null = strict
  #   eviction, the default). Clamped to >= 2 (a lone survivor has no
  #   group-relative signal).
  # group_deadline_s: wall-clock bound on head-of-line blocking — a
  #   group whose oldest trajectory ages past this is resolved (survivor
  #   delivery or eviction; late siblings are counted and dropped).
  #   null = wait indefinitely.
  row_max_attempts: 2
  min_group_survivors: null
  group_deadline_s: null

  # Loss-side version-staleness correction (see staleness_correction.py):
  # the PPO ratio already carries the per-token cross-version IS
  # (bypass_mode: old_log_probs = rollout_log_probs -> ratio = pi_V/pi_vi,
  # clipped = TIS); this layer adds the version-aware treatment —
  # per-trajectory reweighting by version age (gap-aware/SAPipe-style,
  # self-normalized), optional adaptive clip scaling, and (experimental)
  # version-cohort group baselines. Requires the versioned weight path
  # (weight_store) + the trajectory-level producer's version stamps.
  # null = off.
  staleness_correction:
    mode: decay        # none | decay (1/(1+lam*age)) | exp (exp(-lam*age))
    lam: 0.5
    normalize: True    # self-normalize weights to mean 1 (gradient scale)
    adaptive_clip: False   # per-trajectory clip scaling (experimental)
    adaptive_clip_gamma: 0.25  # >0 widens trust region with age; <0 tightens
    adaptive_clip_max_scale: 2.0
    adaptive_clip_min_scale: 0.5
    cohort_baseline: False  # version-cohort GRPO baselines (experimental)

  # Repack closed loop (Laminar §5, the executable subset): after each
  # publish (and periodically), IDLE replicas lagging the fresh version
  # pull it over their OWN engine subgroup (per-replica pull) — the
  # "freed sources pull fresh weights" payoff. Migration-dependent
  # consolidation needs rollout-server request-control RPCs (TODO).
  # null = off.
  repack:
    enabled: True
    check_interval_s: 5.0     # periodic trigger cadence
    # min idle candidates before a version group is worth consolidating
    min_group_candidates: 2
    # migration executes as the DRAIN LIFECYCLE: begin_drain steers new
    # work away from consolidation sources; the completion watcher pulls
    # fresh weights into emptied sources and returns them to routing.
    # hard_drain: ALSO abort in-flight requests on sources — clients
    #   transparently resume them on other replicas (recompute prefill).
    #   Requires abort-resume semantics on the rollout stack (L2
    #   scheduling, or async_training.partial_rollout=true); with
    #   partial_rollout=false on the stock client aborted requests are
    #   DROPPED — do not enable there. Soft (false) never aborts.
    hard_drain: false
    # engine decode batch bound B (CanFit capacity); default: rollout.max_num_seqs
    # batch_bound: 32
    # KV-token estimate per in-flight request; default: prompt+response length
    # kv_per_request: 4096
    # replica index (engine partition order) -> LB server id; default:
    # sorted server ids from the rollouter's load balancer
    server_ids: null

  # Multi-version, pull-based weight path (the relay tier's P0 wiring):
  #   publish = stage-only (actor ranks register per-version CPU shards in
  #             the kimi P2P store; the metadata gather is the whole
  #             trainer-side stall)
  #   pull    = rollout-driven, at group-submission batch boundaries
  # Requires rollout.checkpoint_engine.backend=kimi_ckpt_engine.
  # null = stock push-based sync through the CheckpointEngineManager.
  weight_store:
    backend: kimi
    keep_last: 2
    # host pinned-memory quota: each staged version pins a full CPU copy of
    # the actor shards on every actor rank; the controller retires the
    # oldest live versions (never the latest) when the sum exceeds this.
    # e.g. 68719476736 = 64 GiB; null = keep_last only.
    max_staged_bytes: null

# Rollout config
rollout:

  # Number of nodes used in the rollout
  nnodes: 1

  # Number of GPUs per node
  n_gpus_per_node: 8

  # number of responses (i.e. num sample times). > 1 for grpo — this is the
  # GRPO group size the trainer re-assembles from per-trajectory messages
  n: 4

  # total rollout samples
  total_rollout_steps: 100

data:
  # Number of samples generated, currently only support 1
  gen_batch_size: 1

actor_rollout_ref:

  rollout:
    # Must be enabled! Otherwise, log_probs cannot be calculated.
    calculate_log_probs: True

    standalone_gpu_memory_utilization: null

    # kimi engine required for the versioned pull path
    # (async_training.weight_store); use "nccl" for the stock push path
    # together with weight_store: null
    checkpoint_engine:
      backend: "kimi_ckpt_engine"

  actor:
    # Must use rollout log probs for training
    use_rollout_log_probs: True

  model:
    # To use remove padding (thd)
    use_remove_padding: True


# Only then will the use of log probs be correct.
# And it can be used in conjunction with other rollout_correction algorithms.
algorithm:
  rollout_correction:
    bypass_mode: True
